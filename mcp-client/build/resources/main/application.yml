server:
  port: 8080

spring:
  application:
    name: cidades-mcp-client
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-5}
        max-tokens: 1024
    mcp:
      client:
        enabled: true
        name: cidades-mcp-client
        version: 1.0.0
        type: SYNC
        request-timeout: 30s
        initialized: true
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            cidades:
              url: ${MCP_SERVER_URL:http://localhost:8081}
              endpoint: /mcp
            populacao:
              url: ${MCP_POPULACAO_URL:http://localhost:8082}
              endpoint: /mcp

logging:
  level:
    org.springframework.ai.mcp: DEBUG
